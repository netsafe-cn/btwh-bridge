name: regression-btwh-bridge

on:
  push:
  pull_request:

jobs:
  tests:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # Windows runners default to cp1252 and the suite emits non-ASCII, so force UTF-8
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install minimal test deps
        run: pip install -r requirements-dev.txt
      # Fully offline: no Bluetooth, no network; WinRT cases skip on other platforms
      - name: Full regression (incl. signature contract + golden vectors)
        run: python run_tests.py

  secrets:
    name: no real credentials tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: config.json must never be committed
        shell: bash
        run: |
          if git ls-files --error-unmatch config.json >/dev/null 2>&1; then
            echo "::error::config.json holds a real MAC / pairing code / cloud UID; never commit it"
            exit 1
          fi
          echo "OK: config.json is not tracked"
      - name: Scan for hardcoded cloud UID / pair code in tracked sources
        shell: bash
        run: |
          # test fixtures use fake values (123456 / 654321 / 831152) and are not leaks;
          # a credential in library code is the accident. So test files are out of scope.
          hits=$(git grep -nE 'bemfa_uid\s*=\s*"[0-9a-f]{16,}"|pair_code\s*=\s*"[0-9]{6}"' \
                   -- '*.py' ':!config.example.json' ':!python/tests/' ':!test_*.py' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::a real credential looks hardcoded; inject it from the environment"
            exit 1
          fi
          echo "OK: no hardcoded credentials (test fixtures excluded)"

  layout:
    name: directory boundaries hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The panel is an application ON TOP OF the bridge, never a variant of it. These
      # greps are empty today because firmware/panel has no source yet; they exist so the
      # first person to add one cannot quietly link the bridge.
      - name: panel must not link bridge source or the protocol component
        shell: bash
        run: |
          bad=$(grep -rn -E '#include.*(bridge|bosch_proto)|bosch_proto' firmware/panel \
                  --include='*.c' --include='*.cpp' --include='*.h' --include='*.hpp' || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::firmware/panel may only consume spec/mqtt.json; it must not link bridge or bosch_proto"
            exit 1
          fi
          echo "OK: panel has no bridge dependency"
      - name: no application may be included by a component
        shell: bash
        run: |
          bad=$(grep -rn -E '#include.*(\.\./)+(bridge|panel)/' firmware/components \
                  --include='*.c' --include='*.cpp' --include='*.h' || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::firmware/components must not depend on an application"
            exit 1
          fi
          echo "OK: components are application-free"
      # ADR-008 says proto/ is the only layer that avoids Arduino and NimBLE, and that is the
      # only reason it can ever be tested off-target. A stray include quietly destroys that.
      - name: proto layer stays framework-free
        shell: bash
        run: |
          bad=$(grep -rnE '#include[[:space:]]*[<"](Arduino|NimBLE|Preferences|esp_)' \
                  firmware/bridge/src/proto || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::firmware/bridge/src/proto must not include Arduino, NimBLE or ESP-IDF"
            exit 1
          fi
          echo "OK: proto/ has no framework includes"
      - name: generated vectors match the spec
        shell: bash
        run: python firmware/bridge/tools/gen_vectors.py --check
      - name: every contract file is valid JSON
        shell: bash
        run: |
          for f in spec/*.json; do
            python -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f" || exit 1
            echo "OK: $f"
          done
