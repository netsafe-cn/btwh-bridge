name: regression-btwh-bridge

on:
  push:
  pull_request:

jobs:
  tests:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # Windows runner 默认 cp1252，而测试会打印中文，强制 UTF-8 避免 UnicodeEncodeError
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install minimal test deps
        run: pip install -r requirements-dev.txt
      # 全部离线：不连蓝牙、不连网络；WinRT 相关用例在非 Windows 自动 skip
      - name: Full regression (incl. signature contract + golden vectors)
        run: python run_tests.py

  secrets:
    name: no real credentials tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: config.json must never be committed
        shell: bash
        run: |
          if git ls-files --error-unmatch config.json >/dev/null 2>&1; then
            echo "::error::config.json 含真实 MAC / 配对码 / 云 UID，禁止提交"
            exit 1
          fi
          echo "OK: config.json 未被纳入版本控制"
      - name: Scan for hardcoded cloud UID / pair code in tracked sources
        shell: bash
        run: |
          # 测试里用的是假夹具（123456 / 654321 / 831152），不算密钥泄漏；
          # 库代码里出现才是事故。所以 test_*.py 不参与扫描。
          hits=$(git grep -nE 'bemfa_uid\s*=\s*"[0-9a-f]{16,}"|pair_code\s*=\s*"[0-9]{6}"' \
                   -- '*.py' ':!config.example.json' ':!python/tests/' ':!test_*.py' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::源码里疑似硬编码了真实密钥，请改为环境变量注入"
            exit 1
          fi
          echo "OK: 未发现硬编码密钥（测试夹具已排除）"

  layout:
    name: directory boundaries hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The panel is an application ON TOP OF the bridge, never a variant of it. These
      # greps are empty today because firmware/panel has no source yet; they exist so the
      # first person to add one cannot quietly link the bridge.
      - name: panel must not link bridge source or the protocol component
        shell: bash
        run: |
          bad=$(grep -rn -E '#include.*(bridge|bosch_proto)|bosch_proto' firmware/panel \
                  --include='*.c' --include='*.cpp' --include='*.h' --include='*.hpp' || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::firmware/panel may only consume spec/mqtt.json; it must not link bridge or bosch_proto"
            exit 1
          fi
          echo "OK: panel has no bridge dependency"
      - name: no application may be included by a component
        shell: bash
        run: |
          bad=$(grep -rn -E '#include.*(\.\./)+(bridge|panel)/' firmware/components \
                  --include='*.c' --include='*.cpp' --include='*.h' || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::firmware/components must not depend on an application"
            exit 1
          fi
          echo "OK: components are application-free"
      - name: every contract file is valid JSON
        shell: bash
        run: |
          for f in spec/*.json; do
            python -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f" || exit 1
            echo "OK: $f"
          done
