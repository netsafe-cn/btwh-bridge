name: Feature request
description: Suggest a capability or an improvement
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: Describe the scenario, not the implementation
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine it working
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, or why the obvious one does not fit
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Python library / API
        - ESP32 firmware
        - Home Assistant integration
        - Mi Home / Bemfa bridge
        - Tooling and diagnostics
        - Documentation
        - Support for another model
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require vendor binaries, extracted keys, or bypassing authorisation
          required: true
        - label: I checked existing issues and this is not a duplicate
          required: true
