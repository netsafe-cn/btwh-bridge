# Categories for the release notes GitHub generates.
# Pull requests are grouped by label; anything unlabelled lands in the last category.
# The output is a draft: rewrite it before publishing, especially the "why".
changelog:
  exclude:
    labels:
      - skip-changelog
      - dependencies
  categories:
    - title: Breaking changes
      labels:
        - breaking
        - breaking-change
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Firmware (ESP32)
      labels:
        - esp32
        - firmware
    - title: Documentation
      labels:
        - docs
        - documentation
    - title: Other changes
      labels:
        - "*"
