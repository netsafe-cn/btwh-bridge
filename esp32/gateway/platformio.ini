; 博世热水器 BLE 网关 —— 微雪 ESP32-S3-DEV-KIT-N8R8
; 板卡：ESP32-S3-WROOM-1-N8R8（8MB Flash + 8MB PSRAM）
; 日志口：COM3 = CH343（UART0），烧录也走这个口（板载自动下载电路）
; 注意：不要开 USB CDC On Boot，否则 Serial 会跑到 COM4 原生 USB 上

[platformio]
default_envs = esp32s3
core_dir = .pio

[env:esp32s3]
platform     = espressif32@^6.9.0
board        = esp32-s3-devkitc-1
framework   = arduino

; 必须锁 1.4.x：2.x 的安全回调/notify 回调签名全部变了
lib_deps     = h2zero/NimBLE-Arduino@^1.4.3

upload_port   = COM3
monitor_port  = COM3
monitor_speed = 115200
upload_speed  = 460800

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D ARDUINO_USB_MODE=1

; 8MB Flash，用大分区表（后面加 OTA 时不用重烧分区）
board_build.flash_size  = 8MB
board_build.partitions  = default_8MB.csv

monitor_filters = direct
