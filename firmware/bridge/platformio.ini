; 博世热水器 BLE 网关 —— 微雪 ESP32-S3-DEV-KIT
; 板卡丝印写 N8R8，但实测不符，以实测为准：16MB Flash（esptool 0x46/0x4018）+ 8MB Octal PSRAM
; 主构建路径是 tools/gateway_cli.py + arduino-cli（FQBN 见该文件），本文件仅作 PlatformIO 参考
; 日志口：COM8 = CH343（UART0），烧录也走这个口（板载自动下载电路）
; 注意：不要开 USB CDC On Boot，否则 Serial 会跑到原生 USB 上

[platformio]
default_envs = esp32s3
core_dir = .pio

[env:esp32s3]
platform     = espressif32@^6.9.0
board        = esp32-s3-devkitc-1
framework   = arduino

; 必须锁 1.4.x：2.x 的安全回调/notify 回调签名全部变了
lib_deps     = h2zero/NimBLE-Arduino@^1.4.3

upload_port   = COM8
monitor_port  = COM8
monitor_speed = 115200
upload_speed  = 460800

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D ARDUINO_USB_MODE=1

; 实测 16MB Flash。分区表固定用 default_8MB（两个 3.19MB app 槽 + 1.5MB SPIFFS），
; 与板上实际布局一致；不写 PartitionScheme 会退回 4MB 的 default，把 app 槽砍到 1.31MB。
board_build.flash_size  = 16MB
board_build.partitions  = default_8MB.csv
; PSRAM 在这条路径上未启用：实测 8MB Octal 已验证可用（见 gateway_cli.py 的 PSRAM=opi），
; 但 PlatformIO 侧要开还需 board_build.arduino.memory_type=qio_opi 之类的变体支持，
; 未在本仓库验证过，故不写入，避免留下一条看着对、跑不通的配置。

monitor_filters = direct
